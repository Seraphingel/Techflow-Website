<!DOCTYPE html>
<html lang="en" class="transition-colors duration-1000 ease-in-out">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFlow | Premium Laptop Journal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        organic: {
                            50: '#f8fafc', 100: '#f1f5f9',
                            800: '#1e293b', 900: '#0f172a', 950: '#020617',
                        },
                        fluid: { light: '#e0e7ff', dark: '#312e81', accent: '#6366f1' }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-organic-50 text-slate-800 dark:bg-organic-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none transition-opacity duration-1000" id="ambient-bg">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-fluid-light dark:bg-indigo-900/30 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-200 dark:bg-purple-900/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-pink-200 dark:bg-pink-900/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/80 dark:bg-organic-950/80 border-b border-slate-200 dark:border-slate-800 transition-colors duration-800">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center cursor-pointer group" onclick="app.navigate('home')">
                <div class="w-7 h-7 mr-3 bg-fluid-accent rounded-lg flex items-center justify-center text-white transform group-hover:rotate-12 transition-transform duration-500">
                    <i class="fa-solid fa-laptop-code text-xs"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">
                    Tech<span class="text-fluid-accent font-light">Flow</span>
                </span>
            </div>

            <nav class="nav-island items-center bg-slate-100 dark:bg-slate-900/50 p-1 rounded-full border border-slate-200 dark:border-slate-700/50">
                <button onclick="app.navigate('home')" id="nav-home" class="nav-btn px-4 py-1 rounded-full text-xs font-semibold transition-all">Home</button>
                <button onclick="app.navigate('all')" id="nav-all" class="nav-btn px-4 py-1 rounded-full text-xs font-semibold transition-all">All Brands</button>
                <button onclick="app.navigate('asus')" id="nav-asus" class="nav-btn px-4 py-1 rounded-full text-xs font-semibold transition-all">ASUS</button>
                <button onclick="app.navigate('lenovo')" id="nav-lenovo" class="nav-btn px-4 py-1 rounded-full text-xs font-semibold transition-all">Lenovo</button>
                <button onclick="app.navigate('msi')" id="nav-msi" class="nav-btn px-4 py-1 rounded-full text-xs font-semibold transition-all">MSI</button>
                <button onclick="app.navigate('hp')" id="nav-hp" class="nav-btn px-4 py-1 rounded-full text-xs font-semibold transition-all">HP</button>
            </nav>

            <div class="flex items-center gap-3">
                <button onclick="app.toggleSearch()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all shadow-sm">
                    <i class="fa-solid fa-search text-xs"></i>
                </button>
                <button id="hamburger-btn" onclick="app.toggleMobileMenu()" class="nav-hamburger w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all shadow-sm">
                    <i id="hamburger-icon" class="fa-solid fa-bars text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Navigation Dropdown -->
    <div id="mobile-menu" class="fixed top-14 left-0 right-0 z-30 bg-white/90 dark:bg-organic-950/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 shadow-xl transition-all duration-300 opacity-0 -translate-y-2 pointer-events-none">
        <div class="px-6 py-4 flex flex-col gap-2">
            <button id="mobile-nav-home" onclick="app.navigate('home')" class="mobile-nav-btn text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">Home</button>
            <button id="mobile-nav-all" onclick="app.navigate('all')" class="mobile-nav-btn text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">All Brands</button>
            <button id="mobile-nav-asus" onclick="app.navigate('asus')" class="mobile-nav-btn text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">ASUS</button>
            <button id="mobile-nav-lenovo" onclick="app.navigate('lenovo')" class="mobile-nav-btn text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">Lenovo</button>
            <button id="mobile-nav-msi" onclick="app.navigate('msi')" class="mobile-nav-btn text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">MSI</button>
            <button id="mobile-nav-hp" onclick="app.navigate('hp')" class="mobile-nav-btn text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">HP</button>
        </div>
    </div>

    <!-- Search Overlay -->
    <div id="search-overlay" class="fixed inset-0 z-[70] bg-white/95 dark:bg-organic-950/95 backdrop-blur-xl transition-all duration-500 opacity-0 pointer-events-none flex flex-col pt-32 px-6 items-center">
        <button onclick="app.toggleSearch()" class="absolute top-6 right-6 md:top-8 md:right-8 w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all shadow-sm hover:scale-105">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
        <div class="w-full max-w-3xl transform transition-transform duration-500 translate-y-8" id="search-container">
            <div class="relative w-full">
                <i class="fa-solid fa-search absolute left-6 top-1/2 -translate-y-1/2 text-2xl text-slate-400"></i>
                <input type="text" id="globalSearchOverlay" placeholder="Search series..." 
                       class="w-full py-5 pl-16 pr-6 bg-slate-100 dark:bg-slate-900 rounded-[2rem] border-2 border-slate-200 dark:border-slate-800 focus:border-fluid-accent outline-none text-xl font-semibold text-slate-800 dark:text-slate-200 placeholder-slate-400 shadow-2xl transition-all">
            </div>
            <p class="text-center mt-6 text-sm text-slate-500 font-medium">Press <kbd class="px-2 py-1 bg-slate-200 dark:bg-slate-800 rounded-md mx-1">Enter</kbd> to search</p>
        </div>
    </div>

    <!-- MODEL PICKER BUBBLE (MODAL) -->
    <div id="model-picker-modal" class="fixed inset-0 z-[60] bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
        <div class="modal-bubble bg-white dark:bg-slate-900 rounded-[2.5rem] w-full max-w-2xl shadow-2xl border border-slate-200 dark:border-slate-800 transform scale-95 transition-all duration-300 flex flex-col max-h-[85vh] overflow-hidden">
            
            <!-- FIXED HEADER BLOCK (NEVER SHRINKS OR CLIPS) -->
            <div class="flex-shrink-0 p-5 md:p-6 border-b border-slate-100 dark:border-slate-800 relative overflow-hidden bg-white dark:bg-slate-900 z-10">
                <div class="absolute top-0 right-0 w-32 h-32 bg-fluid-accent/10 dark:bg-fluid-accent/20 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
                
                <div class="flex items-center justify-between gap-4 mb-3 relative z-10">
                    <div>
                        <span id="modal-brand-tag" class="text-xs font-bold uppercase tracking-wider text-fluid-accent block">Brand</span>
                        <h3 id="modal-series-title" class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white leading-tight">Series Name</h3>
                    </div>
                    <button onclick="app.closeModelPicker()" class="flex-shrink-0 w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
                
                <!-- INTEGRATED SORT CONTROL BAR -->
                <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-100 dark:border-slate-800/60 relative z-10">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center">
                        <i class="fa-solid fa-arrow-down-short-wide text-fluid-accent mr-1.5"></i> Sort Models
                    </span>
                    <div class="flex items-center bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200/80 dark:border-slate-700/60 text-xs font-bold">
                        <button id="sort-btn-alpha" onclick="app.setModelSort('alpha')" class="px-2.5 py-1 rounded-lg transition-all flex items-center gap-1">
                            <i class="fa-solid fa-arrow-down-a-z"></i>
                            <span>Alphabetical (A - Z)</span>
                        </button>
                        <button id="sort-btn-year" onclick="app.setModelSort('year')" class="px-2.5 py-1 rounded-lg transition-all flex items-center gap-1">
                            <i class="fa-solid fa-calendar-days"></i>
                            <span>Year Released</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="modal-models-list" class="p-4 md:p-6 overflow-y-auto flex-grow flex flex-col gap-3 min-h-0 bg-slate-50/50 dark:bg-slate-900/50">
                <!-- Models get injected here via JS -->
            </div>
        </div>
    </div>

    <main class="flex-grow flex flex-col w-full relative z-10">
        <div id="app-container" class="w-full flex-grow flex flex-col">
            <!-- Content will be injected here by JS -->
        </div>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-organic-950/50 backdrop-blur-md transition-colors duration-800 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between text-sm">
            <div class="flex items-center mb-4 md:mb-0 text-slate-500 dark:text-slate-400">
                <span class="font-bold mr-2 text-slate-800 dark:text-slate-200">TechFlow</span> &copy; 2026
            </div>
        </div>
    </footer>


    <!-- External Data & App Logic Scripts -->
    <script src="data/laptopData.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
